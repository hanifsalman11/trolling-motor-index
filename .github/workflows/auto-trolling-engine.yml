name: Autonomous Trolling Motor & LiFePO4 Battery Sizing Engine

on:
  schedule:
    - cron: '18 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_boat:
        description: 'Optional Boat or Trolling Motor Model (e.g. Minn Kota Terrova 80 lb)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-trolling-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Trolling Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_BOAT: ${{ github.event.inputs.custom_boat || '' }}
        run: |
          python engine/trolling_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_boats.json
          if git diff --staged --quiet; then
            echo "No new boat calculator pages to commit."
          else
            git commit -m "chore(marine): auto-publish new trolling motor & LiFePO4 calculators"
            git push origin main
          fi
